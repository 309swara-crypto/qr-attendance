<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{margin:0;font-family:Arial;background:#eef2ff}.top{padding:12px;background:#0d47a1;color:#fff;display:flex;justify-content:space-between}.btn{padding:10px 14px;border-radius:10px;border:0;color:#fff;font-weight:700;cursor:pointer}.login-wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}.login-card{background:#fff;padding:22px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.login-card input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}.card{background:#fff;border-radius:14px;padding:14px;margin:12px}</style>
</head>
<body>
{% if is_login %}
<div class="login-wrap"><div class="login-card">
<h3 style="text-align:center;color:#0d47a1">👨‍🏫 Teacher Login</h3>
<form method="post" action="/teacher_login"><input name="uid" placeholder="ID: dbms" required><input name="pwd" type="password" placeholder="Pass: 1234" required><button class="btn" style="background:#0d47a1;width:100%">Login with ID/Pass</button></form>
<hr><p style="text-align:center;font-size:13px">OR Google</p>
<div id="g_id_onload" data-client_id="1028258761253-b1ut3e6kdprrdqrqhr8pn9sqgjv9arj1.apps.googleusercontent.com" data-callback="handleTeacherGoogle"></div>
<div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-width="320" style="display:flex;justify-content:center"></div>
<p style="text-align:center"><a href="/">← Home</a></p>
</div></div>
<script>
function handleTeacherGoogle(res){const payload=JSON.parse(atob(res.credential.split('.')[1]));fetch('/google_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'teacher',email:payload.email,name:payload.name})}).then(r=>r.json()).then(x=>{location.href=x.redirect});}
</script>
{% else %}
<div class="top"><div><b>👨‍🏫 {{teacher}}</b></div>
 <div><a href="/logout" style="color:#fff">Logout</a></div></div>
<div class="card">
<div style="display:flex;gap:8px"><select id="cls" style="flex:1;padding:10px;border-radius:10px">{% for c in classes %}<option>{{c}}</option>{% endfor %}</select><select id="sub" style="flex:1;padding:10px;border-radius:10px">{% for s in subjects %}<option>{{s}}</option>{% endfor %}</select></div>
<p id="locStatus">📍 Getting location...</p>
<button class="btn" style="background:#0d47a1;width:100%" onclick="gen()">Generate QR (2 min + 500m)</button>
<div id="qrBox" style="display:none;text-align:center;margin-top:12px"><img id="qrImg" style="width:230px;border:8px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)"><p id="qrInfo"></p><p id="timer" style="color:red;font-weight:bold"></p></div>
</div>
<div class="card"><h4>Live: {{ac}} Present / {{sc}} Students <a href="/download_attendance" style="float:right">📥 Excel</a></h4><div id="attList"></div></div>
<script>
let tLat=0,tLng=0; navigator.geolocation.getCurrentPosition(p=>{tLat=p.coords.latitude;tLng=p.coords.longitude;locStatus.innerHTML=`✅ Locked: ${tLat.toFixed(5)}, ${tLng.toFixed(5)}`});
function gen(){const fd=new FormData();fd.append('class',cls.value);fd.append('subject',sub.value);fd.append('lat',tLat);fd.append('lng',tLng);fetch('/generate_qr',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{qrBox.style.display='block';qrImg.src='data:image/png;base64,'+d.img;qrInfo.innerText=d.class+' | '+d.subject+' | '+d.token;let l=120;let iv=setInterval(()=>{l--;timer.innerText=l+'s left';if(l<=0){clearInterval(iv);qrBox.style.display='none'}},1000)});}
setInterval(()=>{fetch('/get_attendance').then(r=>r.json()).then(data=>{let h='<table style="width:100%;font-size:13px"><tr><th>Name</th><th>Roll</th><th>Sub</th><th>Dist</th><th>Time</th></tr>';data.slice(-20).reverse().forEach(a=>{h+=`<tr><td>${a.name}</td><td>${a.roll}</td><td>${a.subject}</td><td>${a.dist}m</td><td>${a.time}</td></tr>`});h+='</table>';attList.innerHTML=h})},3000);
</script>
{% endif %}
</body></html>

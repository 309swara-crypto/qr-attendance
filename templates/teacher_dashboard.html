<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard</title>
<style>
body{font-family:Arial;background:#f0f3ff;margin:0;padding:0}
.header{background:#1a3cd4;color:white;padding:18px;text-align:center;font-size:18px;font-weight:bold}
.container{padding:15px;max-width:400px;margin:auto}
.square-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.square{background:white;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1);height:90px;display:flex;flex-direction:column;justify-content:center}
.square h2{margin:5px 0;font-size:28px;color:#1a3cd4}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;margin:6px 0}
.blue{background:#1a56ff;color:white}
.dark{background:#222;color:white}
.green{background:#12a150;color:white}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
</style></head>
<body>
<div class="header">Welcome {{teacher}}  ✅</div>
<div class="container">
<div class="square-grid">
<div class="square"><small>👨‍🎓 Students</small><h2>{{sc}}</h2></div>
<div class="square"><small>📊 Attendance</small><h2>{{ac}}</h2></div>
</div>
<a href="/generate_qr?subject={{teacher}}"><button class="btn blue">📱 Generate QR</button></a>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<a href="/view_attendance"><button class="btn dark">📊 View Attendance ({{ac}})</button></a>
<a href="/student_list"><button class="btn green">👥 Students List</button></a>
</div>
<div style="background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.1)">
<h3 style="margin:0 0 10px 0">➕ Add Student Manually</h3>
<form action="/add_student_manual" method="POST">
<input name="roll" placeholder="Roll No (e.g. 12)" required>
<input name="name" placeholder="Full Name (e.g. Swara Patil)" required>
<input name="class_name" value="tycs" placeholder="Class">
<button class="btn blue" type="submit">Add Student Now</button>
</form>
</div>
<a href="/logout"><button class="btn" style="background:#ffe0e0;color:red">🚪 Logout</button></a>
</div>
</body></html>

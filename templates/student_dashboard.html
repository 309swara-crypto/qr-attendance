<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#f0f3ff;margin:0;padding:0}
.header{background:#1a3cd4;color:white;padding:14px;text-align:center;font-weight:bold}
.container{padding:12px;max-width:400px;margin:auto}
.card{background:white;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin:6px 0}
.blue{background:#1a56ff;color:white}.dark{background:#222;color:white}
#reader{width:100%;border-radius:12px;overflow:hidden;border:2px solid #1a56ff}
</style></head>
<body>
<div class="header">Welcome {{name}} ({{roll}}) ✅</div>
<div class="container">
<div class="card">
<h3 style="margin:5px 0">📷 Attendance Scanner</h3>
<div id="reader"></div>
<p id="msg" style="font-size:13px;color:green;text-align:center">Opening camera...</p>
<button class="btn blue" onclick="location.reload()">🔄 Restart Camera</button>
</div>

<div class="card">
<h4>My Attendance: {{attendance|length}}</h4>
<table style="width:100%;font-size:11px;border-collapse:collapse">
<tr><th style="background:#1a3cd4;color:white;padding:5px">Sub</th><th style="background:#1a3cd4;color:white">Time</th><th style="background:#1a3cd4;color:white">Status</th></tr>
{% for a in attendance %}
<tr><td style="padding:5px;border-bottom:1px solid #eee">{{a[3]}}</td><td style="padding:5px;border-bottom:1px solid #eee">{{a[4]}}</td><td style="padding:5px;border-bottom:1px solid #eee;color:{% if a[5]=='PRESENT' %}green{% else %}red{% endif %};font-weight:bold">{{a[5]}}</td></tr>
{% endfor %}
</table>
</div>
<a href="/logout"><button class="btn dark">Logout</button></a>
</div>

<script>
let qr = new Html5Qrcode("reader");
function start(){
 qr.start({facingMode:"environment"}, {fps:10, qrbox:{width:250,height:250}},
  (text)=>{
   document.getElementById("msg").innerText="QR Found! Opening...";
   qr.stop().then(()=>{ window.location.href=text; });
  },
  (err)=>{}
 ).catch(e=>{
  document.getElementById("msg").innerText="Camera error: Allow camera permission and reload";
 });
}
window.onload = start;
</script>
</body></html>

<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#1e40af;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px;font-family:Arial}.card{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:20px;text-align:center}.btn{width:100%;padding:12px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}.logout{width:100%;padding:10px;background:#eee;border:0;border-radius:8px;margin-top:10px;cursor:pointer}</style></head><body>
<div class="card"><h3>Welcome {{name}}</h3><p>Roll: {{roll}}<br>Class: {{sclass}}</p><p id="loc" style="font-size:12px">📍 Fetching location...</p><button class="btn" onclick="mark()">📷 Scan QR & Mark Attendance</button><div id="msg" style="margin-top:10px;font-weight:bold"></div><button class="logout" onclick="location.href='/logout'">Logout</button></div>
<script>
let lat=0,lon=0;
navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;document.getElementById('loc').innerText='📍 '+lat.toFixed(4)+','+lon.toFixed(4)+' ✅';});
function mark(){
 fetch('/mark_attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:lat,lon:lon})}).then(r=>r.json()).then(d=>{if(d.ok){document.getElementById('msg').innerText='✅ Attendance Marked!';document.getElementById('msg').style.color='green';}else{document.getElementById('msg').innerText='❌ Failed';}});
}
</script></body></html>

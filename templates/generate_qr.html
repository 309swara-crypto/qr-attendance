<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;text-align:center;padding:20px;background:#eef2ff}.card{background:white;padding:20px;border-radius:16px;max-width:400px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}img{width:100%;max-width:300px;border:1px solid #ddd;padding:10px;border-radius:12px}</style></head>
<body><div class="card">
<h3>📱 {{subject}} QR Code</h3>
<img src="data:image/png;base64,{{qr_b64}}">
<p style="word-break:break-all;font-size:11px;color:#666">{{qr_link}}</p>
<p style="font-size:12px">⏰ Valid: 10 Minutes<br>📍 Range: 50 Meters</p>
<a href="/teacher"><button style="padding:10px 20px;background:#1877f2;color:white;border:none;border-radius:8px">Back to Dashboard</button></a>
</div></body></html>

<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify</title>
<style>body{font-family:Arial;background:#f0f3ff;text-align:center;padding:15px}.card{background:white;border-radius:16px;padding:20px;max-width:380px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin:6px 0}.green{background:#12a150;color:white}.blue{background:#1a56ff;color:white}</style></head>
<body>
<div class="card">
<h2>📚 {{subject}} - Mark Attendance</h2>
<p id="st" style="background:#eee;padding:10px;border-radius:8px">📍 Getting GPS...</p>
<p>Roll: <b>{{session.roll}}</b> | {{session.name}}</p>
<form action="/verify_attendance" method="POST">
<input type="hidden" name="qr_id" value="{{qr_id}}">
<input type="hidden" id="lat" name="lat"><input type="hidden" id="lon" name="lon">
<button id="btn" class="btn green" disabled>Getting Location...</button>
</form>
<a href="/student"><button class="btn blue">Back</button></a>
</div>
<script>
navigator.geolocation.getCurrentPosition(p=>{
 document.getElementById("lat").value=p.coords.latitude;
 document.getElementById("lon").value=p.coords.longitude;
 document.getElementById("st").innerText="✅ Location OK";
 document.getElementById("st").style.background="#d4ffd4";
 let b=document.getElementById("btn"); b.disabled=false; b.innerText="✅ Mark PRESENT Now";
}, e=>{
 document.getElementById("lat").value="18.5204"; document.getElementById("lon").value="73.8567";
 document.getElementById("st").innerText="GPS Failed - Using Default";
 let b=document.getElementById("btn"); b.disabled=false; b.innerText="Mark Anyway";
},{enableHighAccuracy:true});
</script>
</body></html>

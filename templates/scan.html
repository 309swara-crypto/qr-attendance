<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Attendance</title>
<style>
body{font-family:Arial;background:#f0f3ff;margin:0;padding:15px;text-align:center}
.card{background:white;border-radius:16px;padding:20px;max-width:380px;margin:20px auto;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.blue{background:#1a56ff;color:white}
.green{background:#12a150;color:white}
.gray{background:#eee;color:#333}
#status{padding:10px;border-radius:8px;margin:10px 0;font-size:14px}
</style></head>
<body>
<div class="card">
<h2>📚 {{subject}} Attendance</h2>
<div id="status" class="gray">📍 Getting your location...</div>
<p style="font-size:13px">Roll: <b>{{session.roll}}</b> | Name: <b>{{session.name}}</b></p>

<form action="/verify_attendance" method="POST" id="attendForm">
<input type="hidden" name="qr_id" value="{{qr_id}}">
<input type="hidden" name="lat" id="lat">
<input type="hidden" name="lon" id="lon">
<button type="submit" class="btn green" id="markBtn" disabled>📍 Wait - Getting Location...</button>
</form>

<p style="font-size:11px;color:#666">You must be within 50m of classroom to be marked PRESENT</p>
<a href="/student"><button class="btn blue">← Back to Student Dashboard</button></a>
</div>

<script>
function updateStatus(msg, color){
  let el = document.getElementById("status");
  el.innerText = msg;
  el.style.background = color;
}
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(pos){
    document.getElementById("lat").value = pos.coords.latitude;
    document.getElementById("lon").value = pos.coords.longitude;
    updateStatus("✅ Location Captured: " + pos.coords.latitude.toFixed(5) + ", " + pos.coords.longitude.toFixed(5), "#d4ffd4");
    let btn = document.getElementById("markBtn");
    btn.disabled = false;
    btn.innerText = "✅ Mark My Attendance Now";
  }, function(err){
    updateStatus("❌ Location Error: " + err.message + " - Please enable GPS", "#ffd4d4");
    // Allow anyway with default
    document.getElementById("lat").value = "18.5204";
    document.getElementById("lon").value = "73.8567";
    let btn = document.getElementById("markBtn");
    btn.disabled = false;
    btn.innerText = "⚠️ Mark Attendance (Location Failed)";
  }, {enableHighAccuracy:true, timeout:10000});
} else {
  updateStatus("❌ Geolocation not supported", "#ffd4d4");
}
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;text-align:center;padding:20px;background:#eef2ff}.card{background:white;padding:25px;border-radius:16px;max-width:360px;margin:auto}button{width:100%;padding:15px;background:green;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold}</style></head>
<body><div class="card">
<h3>{{subject}} Attendance</h3><p style="font-size:12px;color:#666">You are inside classroom range</p>
<form action="/verify_attendance" method="POST">
<input type="hidden" name="qr_id" value="{{qr_id}}">
<input type="hidden" name="lat" id="lat"><input type="hidden" name="lon" id="lon">
<button>📍 Mark My Attendance</button>
</form>
<p id="status" style="font-size:11px;color:green;margin-top:10px">Fetching location...</p>
</div>
<script>
navigator.geolocation.getCurrentPosition(p=>{
 document.getElementById('lat').value=p.coords.latitude;
 document.getElementById('lon').value=p.coords.longitude;
 document.getElementById('status').innerHTML="📍 Location captured - Click button now";
}, e=>{document.getElementById('status').innerHTML="⚠️ Please allow location";});
</script>
</body></html>

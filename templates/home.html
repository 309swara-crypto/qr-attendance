<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Attendance</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{margin:0;background:#1e40af;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;width:92%;max-width:370px;border-radius:20px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
h2{text-align:center;margin:5px 0 15px;font-size:22px}
.tab{display:flex;gap:20px;margin:10px 0}.tab label{font-size:14px}
input{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ccc;border-radius:9px;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:11px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px}
.blue{background:#2563eb;color:#fff}
.white{background:#f8fbff;color:#333;border:1px solid #90caf9}
.small{font-size:11px;color:#666;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h2>📘 QR Attendance</h2>
<div class="tab"><label><input type="radio" name="role" value="teacher" checked> Teacher</label><label><input type="radio" name="role" value="student"> Student</label></div>
ID No<input id="uid" placeholder="Enter ID No e.g. maths">
Password<input id="pwd" type="password" placeholder="Enter Password e.g. 1234">
<button class="btn blue" onclick="loginID()">Login with ID</button>
<button class="btn white" onclick="googleLogin('student')"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Student - Register with Google</button>
<button class="btn white" onclick="googleLogin('teacher')"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Teacher - Login with Google</button>
<p class="small">Teacher: maths / 1234 | Student use Google<br>📍 Location 500m ON</p>
<div id="g_id_onload" data-client_id="YOUR_CLIENT_ID_HERE.apps.googleusercontent.com" data-callback="handleCred"></div>
</div>
<script>
let currentRole='teacher';
function loginID(){
  let role=document.querySelector('input[name="role"]:checked').value;
  if(role!='teacher'){ alert('Students use Register with Google'); return; }
  let f=document.createElement('form');f.method='POST';f.action='/teacher_login';
  f.innerHTML=`<input name="id" value="${uid.value}"><input name="password" value="${pwd.value}">`;
  document.body.appendChild(f);f.submit();
}
function googleLogin(role){
  currentRole=role;
  google.accounts.id.initialize({client_id:"YOUR_CLIENT_ID_HERE.apps.googleusercontent.com",callback:handleCred});
  google.accounts.id.prompt();
}
function handleCred(res){
  const p=JSON.parse(atob(res.credential.split('.')[1]));
  fetch('/google_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:currentRole,email:p.email,name:p.name})}).then(r=>r.json()).then(x=>{
    if(x.need_details){
      let roll=prompt('Enter Roll No:'); if(!roll) return;
      let sclass=prompt('Class:','TYCS');
      fetch('/google_complete_register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:x.email,name:x.name,roll:roll,class:sclass})}).then(r=>r.json()).then(d=>location.href=d.redirect);
    } else location.href=x.redirect;
  });
}
</script>
</body>
</html>

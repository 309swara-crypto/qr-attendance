<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Attendance</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#1e40af;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:22px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
h3{text-align:center;margin:0 0 15px;font-size:18px}
.row{display:flex;gap:20px;margin:10px 0;font-size:14px}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px}
.blue{background:#2563eb;color:#fff}
.white{background:#fff;color:#333;border:1px solid #d1d5db}
.green{background:#16a34a;color:#fff}
.note{font-size:11px;color:#666;text-align:center;margin-top:10px;line-height:1.4}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h3>📘 QR Attendance</h3>
<div class="row">
<label><input type="radio" name="role" value="teacher" checked onchange="toggleRole()"> Teacher</label>
<label><input type="radio" name="role" value="student" onchange="toggleRole()"> Student</label>
</div>

<div id="teacherSection">
ID No<input id="uid_t" placeholder="maths" value="maths">
Password<input id="pwd_t" type="password" placeholder="1234" value="1234">
<button class="btn blue" onclick="loginTeacher()">Login with ID</button>
<button class="btn white" onclick="googleLogin('teacher')"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="16"> Teacher - Login with Google</button>
</div>

<div id="studentSection" class="hidden">
<input id="sname" placeholder="Full Name e.g. Swarup">
<input id="sroll" placeholder="Roll No e.g. 71">
<select id="sclass"><option>TYCS</option><option>TYAIML</option><option>TE-A</option><option>TE-B</option><option>SYCS</option></select>
<button class="btn green" onclick="registerStudent()">✅ Manual Register & Login</button>
<div style="text-align:center;margin:8px;color:#888;font-size:12px">OR</div>
<button class="btn white" onclick="googleLogin('student')"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="16"> Student - Register with Google</button>
<div id="msg" style="color:red;text-align:center;font-weight:bold;margin-top:8px;font-size:13px"></div>
</div>

<div class="note">Teacher: maths / 1234<br>Student: Manual or Google<br>📍 Location 500m ON</div>
<div id="g_id_onload" data-client_id="1028743894018-jo9o39j23pvlrtlq4cf6g3r86nvcoibq.apps.googleusercontent.com" data-callback="handleCred"></div>
</div>

<script>
let currentRole='teacher';
function toggleRole(){
  let r=document.querySelector('input[name="role"]:checked').value;
  currentRole=r;
  if(r=='teacher'){teacherSection.classList.remove('hidden');studentSection.classList.add('hidden');}
  else{teacherSection.classList.add('hidden');studentSection.classList.remove('hidden');}
}
function loginTeacher(){
  let f=document.createElement('form');f.method='POST';f.action='/teacher_login';
  f.innerHTML=`<input name="id" value="${uid_t.value}"><input name="password" value="${pwd_t.value}">`;
  document.body.appendChild(f);f.submit();
}
function registerStudent(){
  if(!sname.value||!sroll.value){alert('Name & Roll needed');return;}
  fetch('/student_manual_register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sname.value,roll:sroll.value,class:sclass.value})})
 .then(r=>r.json()).then(d=>{if(d.ok)location.href='/student_dashboard'; else msg.innerText=d.msg;});
}
function googleLogin(role){
  currentRole=role;
  google.accounts.id.initialize({client_id:"1028743894018-jo9o39j23pvlrtlq4cf6g3r86nvcoibq.apps.googleusercontent.com",callback:handleCred});
  google.accounts.id.prompt();
}
function handleCred(res){
  const p=JSON.parse(atob(res.credential.split('.')[1]));
  fetch('/google_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:currentRole,email:p.email,name:p.name})}).then(r=>r.json()).then(x=>{
    if(x.need_details){
      let roll=prompt('Enter Roll No:'); if(!roll)return;
      let sclass=prompt('Class:','TYCS');
      fetch('/google_complete_register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:x.email,name:x.name,roll:roll,class:sclass})}).then(r=>r.json()).then(d=>location.href=d.redirect);
    } else location.href=x.redirect;
  });
}
</script>
</body>
</html>

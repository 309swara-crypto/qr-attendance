<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan QR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<div class="container">

    <h1>📷 Scan Attendance QR</h1>

    <p>Point your camera at the teacher's QR code.</p>

    <div id="reader" style="width: 300px; margin: auto;"></div>

    <p id="result"></p>

    <br>

    <a href="{{ url_for('student_dashboard') }}">
        Back to Dashboard
    </a>

</div>

<script>

let attendanceMarked = false;


function qrScanned(decodedText) {

    // Stop duplicate scanning
    if (attendanceMarked) {
        return;
    }

    attendanceMarked = true;

    document.getElementById("result").innerHTML =
        "⏳ Checking QR...";


    // Send QR token to Flask
    fetch("/mark_attendance", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            qr_data: decodedText
        })

    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            document.getElementById("result").innerHTML =
                "✅ " + data.message;

            // Stop camera after successful attendance
            scanner.clear();

        } else {

            document.getElementById("result").innerHTML =
                "❌ " + data.message;

            // Allow another scan if QR failed
            attendanceMarked = false;
        }

    })

    .catch(error => {

        console.error(error);

        document.getElementById("result").innerHTML =
            "❌ Error connecting to server.";

        attendanceMarked = false;

    });
}


function qrError(errorMessage) {
    // Ignore normal scanning errors
}


let scanner = new Html5QrcodeScanner(

    "reader",

    {
        fps: 10,
        qrbox: 250
    }

);


scanner.render(qrScanned, qrError);

</script>

</body>
</html>

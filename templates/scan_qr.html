<!DOCTYPE html>
<html>
<head>
    <title>Scan QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        #reader { width: 350px; margin: auto; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Scan Teacher QR Code</h2>
    <div id="reader"></div>
    <div id="result"></div>

    <script>
        let attendanceMarked = false;
        
        function onScanSuccess(decodedText, decodedResult) {
            if (attendanceMarked) return;
            attendanceMarked = true;
            
            document.getElementById("result").innerHTML = "Processing: " + decodedText;
            
            fetch("/mark_attendance", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ qr_data: decodedText })
            })
            .then(async (response) => {
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.log("Server returned:", text);
                    throw new Error("Not logged in as student on phone! Please login first. Server returned login page.");
                }
            })
            .then(data => {
                if (data.success) {
                    document.getElementById("result").innerHTML = "✅ " + data.message;
                } else {
                    document.getElementById("result").innerHTML = "❌ " + data.message;
                    attendanceMarked = false;
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById("result").innerHTML = "❌ " + error.message + "<br><br><b>FIX:</b> Open /login on this phone and login as student first!";
                attendanceMarked = false;
            });
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>

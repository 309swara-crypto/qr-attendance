<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;background:#f0f3ff;padding:15px}table{width:100%;background:white;border-collapse:collapse;font-size:11px}th{background:#1a3cd4;color:white;padding:6px}td{padding:6px;border-bottom:1px solid #eee}.present{color:green;font-weight:bold}.absent{color:red;font-weight:bold}</style></head>
<body><h3>📊 All Attendance ({{attendance|length}})</h3>
<table><tr><th>Roll</th><th>Name</th><th>Class</th><th>Sub</th><th>Time</th><th>Status</th><th>Dist</th></tr>
{% for a in attendance %}<tr><td>{{a[0]}}</td><td>{{a[1]}}</td><td>{{a[2]}}</td><td>{{a[3]}}</td><td>{{a[4]}}</td><td class="{% if a[5]=='PRESENT' %}present{% else %}absent{% endif %}">{{a[5]}}</td><td>{{a[6]}}</td></tr>{% endfor %}
</table><br><a href="/download_attendance"><button style="padding:10px;background:green;color:white;border:none;border-radius:6px">📥 Download Excel</button></a><br><br><a href="/teacher">← Back</a></body></html>

<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:Arial; padding:15px;">
<h2>My Attendance - {{name}} ({{roll}})</h2>
<table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
<tr style="background:#eee;"><th>Date</th><th>Time</th><th>Status</th></tr>
{% for r in records %}
<tr><td>{{r[0]}}</td><td>{{r[1]}}</td><td>Present ✅</td></tr>
{% else %}
<tr><td colspan="3">No records yet</td></tr>
{% endfor %}
</table>
<br>
<a href="/" style="background:#333; color:white; padding:10px 15px; text-decoration:none; border-radius:5px;">Back to Home</a>
</body>
</html>
